[project]
name = "civilcode-worker"
version = "0.0.0"
description = "CivilCode Studio — Celery workers"
requires-python = ">=3.11,<3.13"
dependencies = [
    "celery>=5.4,<6.0",
    "redis>=5.1,<6.0",
    "kombu>=5.3,<5.7",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "sqlalchemy[asyncio]>=2.0.51,<3.0",
    "asyncpg>=0.30,<1.0",
    "numpy==1.26.4",
    "scipy>=1.11,<2.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "ezdxf>=1.3,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civilcode_worker"]
