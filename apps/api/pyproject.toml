[project]
name = "civilcode-api"
version = "0.0.0"
description = "CivilCode Studio — FastAPI backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.140,<1.0",
    "uvicorn[standard]>=0.51,<1.0",
    "pydantic[email]>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0.51,<3.0",
    "alembic>=1.18,<2.0",
    "asyncpg>=0.30,<1.0",
    "bcrypt>=4.2,<5.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=6.1,<9.0",
    "httpx>=0.28,<1.0",
    "boto3>=1.35,<2.0",
    "celery>=5.4,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civilcode_api"]

[tool.hatch.metadata]
allow-direct-references = true
