[project]
name = "civilcode-studio"
version = "0.0.0"
description = "CivilCode Studio — plataforma integral de ingeniería estructural"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Proprietary"}

[tool.uv.workspace]
members = ["packages/engine", "apps/api", "apps/worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "node_modules", "packages/engine/_legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests", "apps/api/tests", "apps/worker/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra --strict-markers"
