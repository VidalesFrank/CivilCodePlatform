[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civilcode-engine"
version = "0.1.0"
description = "Motor de ingeniería estructural (secciones de fibras, materiales, análisis, NSR-10) sobre OpenSeesPy"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "openseespy>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
